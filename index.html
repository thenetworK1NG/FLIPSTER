<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Model Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #viewer { width: 100vw; height: 100vh; display: block; }
        #openFileBtn { position: absolute; top: 10px; left: 10px; z-index: 10; }
        #fileInput { display: none; }
        #cameraInfo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font: 12px/1.5 monospace;
            padding: 8px 10px;
            border-radius: 6px;
            max-width: calc(100vw - 20px);
            user-select: none;
            /* Let wheel events pass through HUD, except on interactive elements like buttons */
            pointer-events: none;
            display: none; /* hide on phone and PC */
        }
        #cameraInfo .row { display: flex; gap: 6px; align-items: center; }
        #cameraInfo .label { opacity: 0.75; }
        #cameraInfo .copy-hint { opacity: 0.55; font-style: italic; }
        #cameraInfo button { pointer-events: auto; }
        @media (max-width: 768px) {
            #cameraInfo { font-size: 11px; padding: 6px 8px; }
        }
            @font-face {
                font-family: 'TheFont';
                src: url("https://garet.typeforward.com/assets/fonts/shared/TFMixVF.woff2") format('woff2');
            }
            .welcome-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: #000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                opacity: 1;
                transition: opacity 1.5s ease;
                pointer-events: none;
            }
            .welcome-overlay.hide {
                opacity: 0;
            }
            .welcome-title {
                font-family: 'TheFont';
                font-size: clamp(5vw, 10vw, 20vh);
                color: white;
                text-align: center;
                margin-bottom: 2vh;
                animation: letter-breathe 5s ease-in-out 1;
            }
            .welcome-sub {
                font-family: 'TheFont';
                font-size: clamp(2vw, 4vw, 8vh);
                color: #ccc;
                text-align: center;
                letter-spacing: 0.1em;
            }
            @keyframes letter-breathe {
                from, to { font-variation-settings: 'wght' 100; }
                50% { font-variation-settings: 'wght' 900; }
            }
    </style>
</head>
<body>
    <!-- Welcome overlay -->
    <!-- Combined Welcome & Loader overlay -->
    <div id="welcomeOverlay" class="welcome-overlay">
        <div class="welcome-title">
            <div>Welcome</div>
            <div>To</div>
            <div>Flipster</div>
        </div>
        <div class="welcome-sub">Made by the networKING</div>
        <div class="loader-container">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="loader-title">loading</div>
        </div>
    </div>
    <button id="openFileBtn">Open GLB File</button>
    <button id="playAnimBtn">Play Animation</button>
    <button id="openBookBtn" style="position:absolute;top:10px;left:140px;z-index:10;">Open Book</button>
    <input type="file" id="fileInput" accept=".glb" />
    <div id="animButtons" style="position:absolute;top:50px;left:10px;z-index:10;"></div>
    <div id="cameraInfo"></div>
    <div id="viewer"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
    <script>
    // Show welcome overlay, then fade out after 3s
    window.addEventListener('DOMContentLoaded', function() {
        var overlay = document.getElementById('welcomeOverlay');
        // Fade out welcome overlay after 3s
        setTimeout(function() {
            overlay.classList.add('hide');
            setTimeout(function() {
                overlay.style.display = 'none';
            }, 1600); // Wait for fade transition
        }, 3000); // Show for 3s
    });
    </script>
