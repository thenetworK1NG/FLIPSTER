<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Model Viewer</title>
        <style>
                *, *:before, *:after {
                    box-sizing: border-box;
                    position: relative;
                }
                * {
                    transform-style: preserve-3d;
                }
                :root {
                    --duration: 3.2s;
                    --stagger: .65s;
                    --easing: cubic-bezier(.36,.07,.25,1);
                    --offscreen: 130vmax;
                    --color-bg: #EF735A;
                    --color-blue: #384969;
                    --color-shadow: #211842;
                }
                .loader-overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    background: var(--color-bg);
                    z-index: 10000;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    transition: opacity 1.5s ease;
                    opacity: 1;
                }
                .loader-overlay.hide {
                    opacity: 0;
                    pointer-events: none;
                }
                #app {
                    height: 70vmin;
                    width: 40vmin;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    transform: translateX(25vw) rotateX(-20deg) rotateY(-55deg);
                    background: var(--color-blue);
                    border-radius: 2vmin;
                    perspective: 10000px;
                }
                #app > .papers, #app:before {
                    transform: translateZ(3vmin);
                }
                #app > .shadow {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    transform-origin: bottom center;
                    transform: rotateX(90deg);
                    background: var(--color-shadow);
                    border-radius: inherit;
                }
                .paper-shadow {
                    background: var(--color-shadow);
                    height: 50%;
                    width: 100%;
                    position: absolute;
                    top: calc(100% + 3vmin);
                    left: 0;
                    transform-origin: top center;
                    animation: shadow-in var(--duration) var(--easing) infinite;
                    animation-delay: calc(var(--i) * var(--stagger));
                    animation-fill-mode: both;
                }
                @keyframes shadow-in {
                    0%,5% {
                        transform: scale(.8, 1) translateY(var(--offscreen));
                    }
                    100% {
                        transform: scale(.8,0);
                    }
                }
                .papers {
                    width: 30vmin;
                    height: 40vmin;
                    background: white;
                }
                .paper {
                    --segments: 5;
                    --segment: calc(100% * 1 / var(--segments));
                    position: absolute;
                    top: 0;
                    left: 0;
                    height: 100%;
                    width: 100%;
                    animation: fly-in var(--duration) var(--easing) infinite;
                    animation-delay: calc((var(--i) * var(--stagger)));
                }
                @keyframes fly-in {
                    0%, 2% {
                        transform: translateZ(var(--offscreen)) translateY(80%) rotateX(30deg);
                    }
                    80%, 100% {
                        transform: translateZ(0px) translateY(0%) rotateX(0deg);
                    }
                }
                .paper > .segment {
                    height: var(--segment);
                }
                .segment {
                    --rotate: 20deg;
                    height: 100%;
                    transform-origin: top center;
                    background: white;
                    border: 1px solid rgba(0,0,0, 0.2);
                    border-top: none;
                    border-bottom: none;
                    animation: inherit;
                    animation-name: curve-paper;
                }
                @keyframes curve-paper {
                    0%, 2% { transform: rotateX(var(--rotate,0deg)); }
                    90%, 100% { transform: rotateX(0deg); }
                }
                .paper.-rogue {
                    transform-origin: top center -5vmin;
                }
                .paper.-rogue .segment {
                    --rotate: 30deg;
                    animation-name: curve-rogue-paper;
                }
                @keyframes curve-rogue-paper {
                    0%, 50% { transform: rotateX(var(--rotate)); }
                    100% { transform: rotateX(0deg); }
                }
                .paper.-rogue > .segment {
                    animation: inherit;
                    animation-name: rogue-paper;
                    transform-origin: left top 20vmin;
                }
                @keyframes rogue-paper {
                    0%, 2% {
                        transform: rotateX(1.5turn)
                    }
                    80%, 100% {
                        transform: rotateX(0turn);
                    }
                }
        body { margin: 0; overflow: hidden; }
        #viewer { width: 100vw; height: 100vh; display: block; }
        #openFileBtn { position: absolute; top: 10px; left: 10px; z-index: 10; }
        #fileInput { display: none; }
        #cameraInfo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font: 12px/1.5 monospace;
            padding: 8px 10px;
            border-radius: 6px;
            max-width: calc(100vw - 20px);
            user-select: none;
            /* Let wheel events pass through HUD, except on interactive elements like buttons */
            pointer-events: none;
            display: none; /* hide on phone and PC */
        }
        #cameraInfo .row { display: flex; gap: 6px; align-items: center; }
        #cameraInfo .label { opacity: 0.75; }
        #cameraInfo .copy-hint { opacity: 0.55; font-style: italic; }
        #cameraInfo button { pointer-events: auto; }
        @media (max-width: 768px) {
            #cameraInfo { font-size: 11px; padding: 6px 8px; }
        }
            @font-face {
                font-family: 'TheFont';
                src: url("https://garet.typeforward.com/assets/fonts/shared/TFMixVF.woff2") format('woff2');
            }
    </style>
</head>
<body>
        <div id="loaderOverlay" class="loader-overlay">
            <div id="app">
                <div class="papers" style="--total: 5">
                    <div class="paper -rogue" style="--i: 0">
                        <div class="segment"><div class="segment"><div class="segment"><div class="segment"><div class="segment"></div></div></div></div></div>
                    </div>
                    <div class="paper" style="--i: 1">
                        <div class="segment"><div class="segment"><div class="segment"><div class="segment"><div class="segment"></div></div></div></div></div>
                    </div>
                    <div class="paper" style="--i: 2">
                        <div class="segment"><div class="segment"><div class="segment"><div class="segment"><div class="segment"></div></div></div></div></div>
                    </div>
                    <div class="paper" style="--i: 3">
                        <div class="segment"><div class="segment"><div class="segment"><div class="segment"><div class="segment"></div></div></div></div></div>
                    </div>
                    <div class="paper" style="--i: 4">
                        <div class="segment"><div class="segment"><div class="segment"><div class="segment"><div class="segment"></div></div></div></div></div>
                    </div>
                </div>
                <div class="shadow">
                    <div class="paper-shadow" style="--i: 0"></div>
                    <div class="paper-shadow" style="--i: 1"></div>
                    <div class="paper-shadow" style="--i: 2"></div>
                    <div class="paper-shadow" style="--i: 3"></div>
                    <div class="paper-shadow" style="--i: 4"></div>
                </div>
            </div>
        </div>
        <button id="openFileBtn">Open GLB File</button>
        <button id="playAnimBtn">Play Animation</button>
        <button id="openBookBtn" style="position:absolute;top:10px;left:140px;z-index:10;">Open Book</button>
        <input type="file" id="fileInput" accept=".glb" />
    <div id="animButtons" style="position:absolute;top:50px;left:10px;z-index:10;"></div>
    <div id="cameraInfo"></div>
    <div id="viewer"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
    <script>
    // Show welcome overlay, then fade out after 3s
    window.addEventListener('DOMContentLoaded', function() {
        var overlay = document.getElementById('welcomeOverlay');
        // Fade out welcome overlay after 3s
        setTimeout(function() {
            overlay.classList.add('hide');
            setTimeout(function() {
                overlay.style.display = 'none';
            }, 1600); // Wait for fade transition
        }, 3000); // Show for 3s
    });
    </script>
