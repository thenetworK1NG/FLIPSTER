        <style>
                *, *:before, *:after {
                    box-sizing: border-box;
                    position: relative;
                }
                * {
                    transform-style: preserve-3d;
                }
                :root {
                    --duration: 3.2s;
                    --stagger: .65s;
                    --easing: cubic-bezier(.36,.07,.25,1);
                    --offscreen: 130vmax;
                    --color-bg: #EF735A;
                    --color-blue: #384969;
                    --color-shadow: #211842;
                }
                /* Loader overlay CSS removed */
                /* Flipster loader styles */
                .animation01 {
                    position: absolute;
                    width: 100%;
                    height: 100%;
                    background-color: #384150;
                }
                .animation01 .line_content {
                    width: 100%;
                    height: 50%;
                    animation: animation01_content 0.3s ease-in forwards;
                }
                .animation01 .line_content01 {
                    transform-origin: bottom;
                }
                .animation01 .line_content02 {
                    transform-origin: top;
                }
                .animation01 .line_wrapper {
                    width: 100%;
                    height: 100%;
                }
                .animation01 .line_wrapper01 {
                    transform-origin: bottom;
                    animation: animation01_wrapper01 0.5s ease-in-out 0.2s forwards;
                }
                .animation01 .line_wrapper02 {
                    transform-origin: top;
                    animation: animation01_wrapper02 0.5s ease-in-out 0.2s forwards;
                }
                .animation01 .line01 {
                    width: 100%;
                    height: 50%;
                    background-color: #d05464;
                }
                .animation01 .line02 {
                    width: 100%;
                    height: 50%;
                    background-color: #c98b4f;
                }
                @keyframes animation01_content {
                    0% { transform: scale3d(1, 0, 1); }
                    100% { transform: scale3d(1, 1, 1); }
                }
                @keyframes animation01_wrapper01 {
                    0% { transform: translateY(0); }
                    100% { transform: translateY(-50vw); }
                }
                @keyframes animation01_wrapper02 {
                    0% { transform: translateY(0); }
                    100% { transform: translateY(50vw); }
                }
                .animation02 {
                    position: absolute;
                    width: 100%;
                    height: 100%;
                }
                .square {
                    position: absolute;
                    top: 0;
                    right: 0;
                    bottom: 0;
                    left: 0;
                    width: 8vw;
                    height: 8vw;
                    margin: auto;
                    background-color: #c03d5c;
                    animation: square 0.2s ease-in-out 0.6s forwards;
                    opacity: 0;
                    z-index: 100;
                }
                @keyframes square {
                    0% { transform: rotate(45deg); opacity: 0; }
                    100% { transform: rotate(0); opacity: 1; }
                }
                .square_item {
                    display: block;
                    position: absolute;
                    width: 0.5vw;
                    height: 0.5vw;
                    margin: auto;
                    background-color: #c03d5c;
                    border-radius: 50%;
                    opacity: 0;
                }
                .square_item01 { top: -105%; right: 0; bottom: 0; left: 0; animation: square_item01 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                .square_item02 { top: 0; right: 0; bottom: 0; left: 99%; animation: square_item02 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                .square_item03 { top: 105%; right: 0; bottom: 0; left: 0; animation: square_item03 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                .square_item04 { top: 0; right: 0; bottom: 0; left: -99%; animation: square_item04 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                .square_item05 { top: -105%; right: 0; bottom: 0; left: 99%; animation: square_item05 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                .square_item06 { top: 105%; right: 0; bottom: 0; left: 99%; animation: square_item06 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                .square_item07 { top: 105%; right: 0; bottom: 0; left: -99%; animation: square_item07 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                .square_item08 { top: -105%; right: 0; bottom: 0; left: -99%; animation: square_item08 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s; }
                @keyframes square_item01 { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-7vw); opacity: 1; } }
                @keyframes square_item02 { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(7vw); opacity: 1; } }
                @keyframes square_item03 { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(7vw); opacity: 1; } }
                @keyframes square_item04 { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-7vw); opacity: 1; } }
                @keyframes square_item05 { 0% { transform: translate3d(0, 0, 0); opacity: 1; } 100% { transform: translate3d(3.5vw, -3.5vw, -3.5vw); opacity: 1; } }
                @keyframes square_item06 { 0% { transform: translate3d(0, 0, 0); opacity: 1; } 100% { transform: translate3d(3.5vw, 3.5vw, 3.5vw); opacity: 1; } }
                @keyframes square_item07 { 0% { transform: translate3d(0, 0, 0); opacity: 1; } 100% { transform: translate3d(-3.5vw, 3.5vw, 3.5vw); opacity: 1; } }
                @keyframes square_item08 { 0% { transform: translate3d(0, 0, 0); opacity: 1; } 100% { transform: translate3d(-3.5vw, -3.5vw, 3.5vw); opacity: 1; } }
                .circle_item01 { position: absolute; top: 150%; right: 0; bottom: 0; left: 90%; width: 5vw; height: 5vw; margin: auto; background-color: #6f919a; border-radius: 50%; animation: circle_item 1.0s cubic-bezier(0.19, 1, 0.22, 1) 1.1s forwards; opacity: 0; }
                .circle_item02 { position: absolute; top: 125%; right: 0; bottom: 0; left: 125%; width: 5vw; height: 5vw; margin: auto; background-color: #c24a50; border-radius: 50%; animation: circle_item 1.0s cubic-bezier(0.19, 1, 0.22, 1) 1.15s forwards; opacity: 0; }
                .circle_item03 { position: absolute; top: 100%; right: 0; bottom: 0; left: 158%; width: 5vw; height: 5vw; margin: auto; background-color: #d6a2a6; border-radius: 50%; animation: circle_item 1.0s cubic-bezier(0.19, 1, 0.22, 1) 1.2s forwards; opacity: 0; }
                .circle_item04 { position: absolute; top: -150%; right: 0; bottom: 0; left: -158%; width: 5vw; height: 5vw; margin: auto; background-color: #6f919a; border-radius: 50%; animation: circle_item 1.0s cubic-bezier(0.19, 1, 0.22, 1) 1.1s forwards; opacity: 0; }
                .circle_item05 { position: absolute; top: -125%; right: 0; bottom: 0; left: -227%; width: 5vw; height: 5vw; margin: auto; background-color: #c24a50; border-radius: 50%; animation: circle_item 1.0s cubic-bezier(0.19, 1, 0.22, 1) 1.15s forwards; opacity: 0; }
                .circle_item06 { position: absolute; top: -100%; right: 0; bottom: 0; left: -298%; width: 5vw; height: 5vw; margin: auto; background-color: #d6a2a6; border-radius: 50%; animation: circle_item 1.0s cubic-bezier(0.19, 1, 0.22, 1) 1.2s forwards; opacity: 0; }
                @keyframes circle_item { 0% { transform: scale3d(0, 0, 1); opacity: 1; } 75% { transform: scale3d(1, 1, 1); opacity: 1; } 100% { transform: scale3d(0.5, 0.5, 1); opacity: 1; } }
                .circle_item01_1 { position: absolute; top: 150%; right: 0; bottom: 0; left: 106%; width: 2.5vw; height: 2.5vw; margin: auto; background-color: #6f919a; border-radius: 50%; animation: circle_twice 0.25s linear 2s forwards; opacity: 0; }
                .circle_item02_2 { position: absolute; top: 175%; right: 0; bottom: 0; left: 141%; width: 2.5vw; height: 2.5vw; margin: auto; background-color: #c24a50; border-radius: 50%; animation: circle_twice 0.245s linear 2.05s forwards; opacity: 0; }
                .circle_item03_3 { position: absolute; top: 200%; right: 0; bottom: 0; left: 175%; width: 2.5vw; height: 2.5vw; margin: auto; background-color: #d6a2a6; border-radius: 50%; animation: circle_twice 0.24s linear 2.1s forwards; opacity: 0; }
                .circle_item04_4 { position: absolute; top: -150%; right: 0; bottom: 0; left: -158%; width: 2.5vw; height: 2.5vw; margin: auto; background-color: #6f919a; border-radius: 50%; animation: circle_third 0.25s linear 2s forwards; opacity: 0; }
                .circle_item05_5 { position: absolute; top: -175%; right: 0; bottom: 0; left: -227%; width: 2.5vw; height: 2.5vw; margin: auto; background-color: #c24a50; border-radius: 50%; animation: circle_third 0.245s linear 2.05s forwards; opacity: 0; }
                .circle_item06_6 { position: absolute; top: -200%; right: 0; bottom: 0; left: -298%; width: 2.5vw; height: 2.5vw; margin: auto; background-color: #d6a2a6; border-radius: 50%; animation: circle_third 0.24s linear 2.1s forwards; opacity: 0; }
                @keyframes circle_twice { 0% { transform: translate3d(0, 0, 0); opacity: 1; } 25% { transform: translate3d(75%, -120%, 0); opacity: 1; } 50% { transform: translate3d(100%, -240%, 0); opacity: 1; } 75% { transform: translate3d(75%, -360%, 0); opacity: 1; } 100% { transform: translate3d(0, -480%, 0); opacity: 1; } }
                @keyframes circle_third { 0% { transform: translate3d(0, 0, 0); opacity: 1; } 25% { transform: translate3d(75%, 120%, 0); opacity: 1; } 50% { transform: translate3d(100%, 240%, 0); opacity: 1; } 75% { transform: translate3d(75%, 360%, 0); opacity: 1; } 100% { transform: translate3d(0, 480%, 0); opacity: 1; } }
                .animation03 {
                    display: flex;
                    align-items: center;
                    flex-wrap: wrap;
                    position: absolute;
                    width: 100%;
                    height: 100%;
                }
                .animation03 div {
                    width: 10vw;
                    height: 10vw;
                    background-color: #cac9ca;
                    transform: rotate(45deg);
                    animation: bg 0.5s linear 2.5s forwards;
                    opacity: 0;
                    z-index: 99;
                }
                @keyframes bg {
                    0% { transform: scale3d(0, 0, 0) rotate(45deg); opacity: 1; }
                    75% { transform: scale3d(1, 1, 1) rotate(45deg); opacity: 1; }
                    100% { transform: scale3d(1.5, 1.5, 1) rotate(45deg); opacity: 1; }
                }
                .animation04 {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    width: 100%;
                    height: 100%;
                    z-index: 9998;
                }
                .name_plate {
                    position: absolute;
                    top: 0;
                    right: 0;
                    bottom: 0;
                    left: 0;
                    width: 40vw;
                    height: 16vw;
                    margin: auto;
                    background-color: #3d3c3e;
                    transform-origin: center;
                    animation: name_plate 1s cubic-bezier(0.165, 0.84, 0.44, 1) 3.1s forwards;
                    opacity: 0;
                }
                @keyframes name_plate {
                    0% { transform: scale3d(0, 1, 1); opacity: 1; }
                    100% { transform: scale3d(1, 1, 1); opacity: 1; }
                }
                .name {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    color: teal;
                    font-size: 3vw;
                    font-weight: bold;
                    font-family: 'Arial Black', Arial, Helvetica, sans-serif;
                    letter-spacing: 0.2em;
                    animation: name 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) 4.1s forwards;
                    opacity: 0;
                }
                @keyframes name {
                    0% { opacity: 0; }
                    100% { opacity: 1; }
                }
                }
                #app {
                    height: 70vmin;
                    width: 40vmin;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    transform: translateX(25vw) rotateX(-20deg) rotateY(-55deg);
                    background: var(--color-blue);
                    border-radius: 2vmin;
                    perspective: 10000px;
                }
                #app > .papers, #app:before {
                    transform: translateZ(3vmin);
                }
                #app > .shadow {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    transform-origin: bottom center;
                    transform: rotateX(90deg);
                    background: var(--color-shadow);
                    border-radius: inherit;
                }
                .paper-shadow {
                    background: var(--color-shadow);
                    height: 50%;
                    width: 100%;
                    position: absolute;
                    top: calc(100% + 3vmin);
                    left: 0;
                    transform-origin: top center;
                    animation: shadow-in var(--duration) var(--easing) infinite;
                    animation-delay: calc(var(--i) * var(--stagger));
                    animation-fill-mode: both;
                }
                @keyframes shadow-in {
                    0%,5% {
                        transform: scale(.8, 1) translateY(var(--offscreen));
                    }
                    100% {
                        transform: scale(.8,0);
                    }
                }
                .papers {
                    width: 30vmin;
                    height: 40vmin;
                    background: white;
                }
                .paper {
                    --segments: 5;
                    --segment: calc(100% * 1 / var(--segments));
                    position: absolute;
                    top: 0;
                    left: 0;
                    height: 100%;
                    width: 100%;
                    animation: fly-in var(--duration) var(--easing) infinite;
                    animation-delay: calc((var(--i) * var(--stagger)));
                }
                @keyframes fly-in {
                    0%, 2% {
                        transform: translateZ(var(--offscreen)) translateY(80%) rotateX(30deg);
                    }
                    80%, 100% {
                        transform: translateZ(0px) translateY(0%) rotateX(0deg);
                    }
                }
                .paper > .segment {
                    height: var(--segment);
                }
                .segment {
                    --rotate: 20deg;
                    height: 100%;
                    transform-origin: top center;
                    background: white;
                    border: 1px solid rgba(0,0,0, 0.2);
                    border-top: none;
                    border-bottom: none;
                    animation: inherit;
                    animation-name: curve-paper;
                }
                @keyframes curve-paper {
                    0%, 2% { transform: rotateX(var(--rotate,0deg)); }
                    90%, 100% { transform: rotateX(0deg); }
                }
                .paper.-rogue {
                    transform-origin: top center -5vmin;
                }
                .paper.-rogue .segment {
                    --rotate: 30deg;
                    animation-name: curve-rogue-paper;
                }
                @keyframes curve-rogue-paper {
                    0%, 50% { transform: rotateX(var(--rotate)); }
                    100% { transform: rotateX(0deg); }
                }
                .paper.-rogue > .segment {
                    animation: inherit;
                    animation-name: rogue-paper;
                    transform-origin: left top 20vmin;
                }
                @keyframes rogue-paper {
                    0%, 2% {
                        transform: rotateX(1.5turn)
                    }
                    80%, 100% {
                        transform: rotateX(0turn);
                    }
                }
        body { margin: 0; overflow: hidden; }
        #viewer { width: 100vw; height: 100vh; display: block; }
        #openFileBtn { position: absolute; top: 10px; left: 10px; z-index: 10; }
        #fileInput { display: none; }
        #cameraInfo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font: 12px/1.5 monospace;
            padding: 8px 10px;
            border-radius: 6px;
            max-width: calc(100vw - 20px);
            user-select: none;
            /* Let wheel events pass through HUD, except on interactive elements like buttons */
            pointer-events: none;
            display: none; /* hide on phone and PC */
        }
        #cameraInfo .row { display: flex; gap: 6px; align-items: center; }
        #cameraInfo .label { opacity: 0.75; }
        #cameraInfo .copy-hint { opacity: 0.55; font-style: italic; }
        #cameraInfo button { pointer-events: auto; }
        @media (max-width: 768px) {
            #cameraInfo { font-size: 11px; padding: 6px 8px; }
        }

            }

    <script>
    // Fade out Flipster intro only after FLIPSTER text animation completes (4.6s)
    window.addEventListener('DOMContentLoaded', function() {
        var intro = document.getElementById('flipsterIntro');
        setTimeout(function() {
            intro.style.transition = 'opacity 1.2s';
            intro.style.opacity = '0';
            setTimeout(function() {
                intro.style.display = 'none';
            }, 1200); // Wait for fade transition
        }, 4600); // Wait for FLIPSTER animation (4.1s delay + 0.5s anim)
    });
