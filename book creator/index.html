<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0e0e14">
    <title>Flipster — Scrapbook Creator</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/app-header.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/camera-hud.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-brand">flip<span>ster</span></div>
        <div class="loader-spinner"></div>
    </div>

    <header id="appHeader" class="app-header">
        <a href="../index.html" class="app-header-brand">flipster</a>
        <span class="app-header-divider"></span>
        <span class="app-header-subtitle">Creator</span>
        <div class="app-header-spacer"></div>
        <span class="app-header-hint" id="headerHint"></span>
    </header>

    <div id="animButtons" class="anim-buttons"></div>
    <div id="cameraInfo"></div>
    <div id="viewer"></div>

    <button id="mobileFab" class="mobile-fab" aria-label="Open pages panel">
        <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="1" width="12" height="14" rx="2"/>
            <line x1="5" y1="5" x2="11" y2="5"/>
            <line x1="5" y1="8" x2="11" y2="8"/>
            <line x1="5" y1="11" x2="9" y2="11"/>
        </svg>
    </button>

    <div id="mobileBackdrop" class="mobile-backdrop"></div>
    <div id="pageConfigPanel" class="page-config-panel">
        <button id="togglePagePanel" class="page-panel-toggle">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="1" width="12" height="14" rx="2"/>
                <line x1="5" y1="5" x2="11" y2="5"/>
                <line x1="5" y1="8" x2="11" y2="8"/>
                <line x1="5" y1="11" x2="9" y2="11"/>
            </svg>
        </button>
        <div id="pagePanelContent" class="page-panel-content">
            <div class="page-panel-header">
                <div class="page-panel-title-row">
                    <button id="panelBackBtn" class="page-action-btn panel-back-btn" title="Back">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="10 12 6 8 10 4"/>
                        </svg>
                    </button>
                    <h3>Pages</h3>
                    <span class="page-panel-count" id="pagePanelCount">0</span>
                </div>
            </div>
            <div class="page-panel-actions">
                <button id="showAllPages" class="page-action-btn" title="Show all pages">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/>
                        <circle cx="8" cy="8" r="2"/>
                    </svg>
                </button>
                <button id="hideAllPages" class="page-action-btn" title="Hide all pages">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/>
                        <line x1="2" y1="2" x2="14" y2="14"/>
                    </svg>
                </button>
                <button id="resetAllImages" class="page-action-btn" title="Reset all images">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 8a6 6 0 1 1 1.5 4"/>
                        <polyline points="2 12 2 8 6 8"/>
                    </svg>
                </button>
            </div>
            <div id="pageList" class="page-list"></div>
            <div class="page-panel-footer">
                <div class="page-panel-footer-text" id="pagePanelFooter">0 pages</div>
                <button id="exportScrapbookBtn" class="page-export-btn">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 2v8M4 6l4 4 4-4"/>
                        <path d="M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/>
                    </svg>
                    <span>Export ZIP</span>
                </button>
            </div>
        </div>
    </div>
    <div id="editorOverlay" class="editor-overlay">
        <div class="editor-toolbar-wrap">
            <div class="editor-toolbar-secondary">
                <div class="editor-toolbar-group">
                    <button id="editorUndo" class="editor-btn" title="Undo (Ctrl+Z)" disabled>
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h7a3 3 0 010 6H8"/>
                            <polyline points="6 3 3 6 6 9"/>
                        </svg>
                    </button>
                    <button id="editorRedo" class="editor-btn" title="Redo (Ctrl+Y)" disabled>
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 6H6a3 3 0 000 6h2"/>
                            <polyline points="10 3 13 6 10 9"/>
                        </svg>
                    </button>
                </div>
                <div class="editor-toolbar-divider"></div>
                <div class="editor-toolbar-group">
                    <button id="editorForward" class="editor-btn" title="Bring Forward">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 10 8 6 12 10"/>
                        </svg>
                    </button>
                    <button id="editorBack" class="editor-btn" title="Send Back">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 6 8 10 12 6"/>
                        </svg>
                    </button>
                    <button id="editorDelete" class="editor-btn editor-btn-danger" title="Delete (Del)">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 4 4 4 13 4"/>
                            <path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/>
                            <path d="M12 4l-1 9a1 1 0 01-1 1H6a1 1 0 01-1-1L4 4"/>
                        </svg>
                    </button>
                </div>
                <div class="editor-toolbar-divider"></div>
                <div class="editor-toolbar-group">
                    <div class="editor-bg-picker">
                        <label>BG</label>
                        <input type="color" id="editorBgColor" value="#ffffff">
                    </div>
                </div>
                <div class="editor-toolbar-divider"></div>
                <div class="editor-toolbar-group">
                    <button id="editorClear" class="editor-btn editor-btn-danger">Clear All</button>
                </div>
            </div>
            <div class="editor-toolbar">
                <div class="editor-toolbar-group editor-toolbar-back">
                    <button id="editorBackBtn" class="page-action-btn" aria-label="Back to book">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="10 12 6 8 10 4"/>
                        </svg>
                    </button>
                </div>
                <div class="editor-toolbar-divider"></div>
                <div class="editor-toolbar-group">
                    <button id="editorAddImage" class="editor-btn editor-btn-accent">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/>
                        </svg>
                        <span>Add Image</span>
                    </button>
                </div>
                <div class="editor-toolbar-divider"></div>
                <div class="editor-toolbar-group">
                    <button id="editorToolbarMore" class="editor-btn" aria-label="More tools">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="3" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="8" cy="13" r="1.2"/>
                        </svg>
                    </button>
                </div>
                <div class="editor-toolbar-divider"></div>
                <div class="editor-toolbar-group">
                    <button id="editorSave" class="editor-btn editor-btn-primary">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V3a1 1 0 00-1-1z"/>
                            <polyline points="5 2 5 6 11 6 11 2"/>
                        </svg>
                        <span>Save</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="editor-canvas-wrap">
            <div id="editorCanvas" class="editor-canvas">
                <div id="editorBg" class="editor-bg" style="background: #ffffff;"></div>
                <div id="editorEmptyState" class="editor-empty-state">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted)">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>Drop images here</span>
                    <span class="editor-empty-hint">or click Add Image to start</span>
                </div>
                <div id="editorDropZone" class="editor-drop-zone"><span>Drop images here</span></div>
                <div id="editorSelectionToolbar" class="editor-selection-toolbar" style="display:none;">
                    <button class="sel-btn" id="selForward" title="Bring Forward">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 10 8 6 12 10"/></svg>
                    </button>
                    <button class="sel-btn" id="selBack" title="Send Back">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 6 8 10 12 6"/></svg>
                    </button>
                    <button class="sel-btn" id="selDuplicate" title="Duplicate">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="5" width="9" height="9" rx="1"/>
                            <path d="M2 11V3a1 1 0 011-1h8"/>
                        </svg>
                    </button>
                    <button class="sel-btn sel-btn-danger" id="selDelete" title="Delete (Del)">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 4 4 4 13 4"/>
                            <path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/>
                            <path d="M12 4l-1 9a1 1 0 01-1 1H6a1 1 0 01-1-1L4 4"/>
                        </svg>
                    </button>
                </div>
                <span class="editor-hint">Drag to position &middot; Shift+drag corners to resize proportionally &middot; Drag circle to rotate &middot; Shift+drag circle to snap 15&deg;</span>
            </div>
        </div>
    </div>
    <input type="file" id="editorFileInput" accept="image/*" multiple style="display:none" />
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
