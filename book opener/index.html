<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBook</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/camera-hud.css">
    <style>
        body { margin: 0; overflow: hidden; background: var(--bg-primary); }
        .landing {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-primary);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            padding: 24px;
            transition: opacity 0.8s ease;
        }
        .landing.hide { opacity: 0; pointer-events: none; }
        .landing h1 {
            color: var(--text-primary); font-family: 'Inter', sans-serif;
            font-size: clamp(28px, 8vw, 52px);
            margin: 0; letter-spacing: -0.5px; font-weight: 700;
        }
        .landing h1 span { color: var(--accent); }
        .landing p { color: rgba(255,255,255,0.45); font-size: 14px; margin: 0; }
        .drop-zone {
            width: 100%; max-width: 360px; min-height: 140px;
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 16px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
            color: rgba(255,255,255,0.35); transition: all 0.25s; cursor: pointer;
            padding: 28px 20px; margin-top: 8px;
        }
        .drop-zone:hover, .drop-zone.active {
            border-color: var(--accent); background: rgba(124,106,239,0.06);
            color: var(--accent);
        }
        .drop-zone .icon { font-size: 36px; opacity: 0.5; }
        .drop-zone .label { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.6); }
        .drop-zone .hint { font-size: 12px; color: rgba(255,255,255,0.25); }
        .browse-btn {
            display: inline-block; margin-top: 4px; padding: 10px 28px;
            background: var(--accent); color: #fff; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s; font-family: inherit;
        }
        .browse-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,106,239,0.4); }
        .browse-btn:active { transform: scale(0.97); }
        #landingStatus { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="landingOverlay" class="landing">
        <h1>flip<span>ster</span></h1>
        <p>Open a scrapbook to view it</p>
        <div id="dropZone" class="drop-zone">
            <div class="icon">&#128214;</div>
            <div class="label">Drop scrapbook .zip here</div>
            <div class="hint">or click below to browse</div>
            <button id="browseBtn" class="browse-btn">Browse Files</button>
        </div>
        <div id="landingStatus"></div>
        <input type="file" id="scrapbookFileInput" accept=".zip" style="display:none" />
    </div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-brand">flip<span>ster</span></div>
        <div class="loader-spinner"></div>
    </div>

    <div id="animButtons" style="position:absolute;top:10px;left:10px;z-index:10;"></div>
    <div id="cameraInfo"></div>
    <div id="viewer"></div>



    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
